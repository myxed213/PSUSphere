{% extends 'base.html' %}
{% load static %}

{% block content %}
<div class="container-fluid">
    <h4 class="page-title">Colleges</h4>
    <div class="row">
        <div class="col-md-12">
            <div class="card">
                <div class="card-header">
                    <div class="card-title">List of Colleges</div>
                    <div class="card-category">Manage college entities.</div>
                </div>
                <div class="card-body">
                    <table class="table table-head-bg-info mt-4">
                        <thead>
                            <tr>
                                <th scope="col">College Name</th>
                                <th scope="col">Action</th>
                            </tr>
                        </thead>
                        <tbody>
                            {% for object in object_list %}
                            <tr>
                                <td>{{ object.college_name }}</td>
                                <td>
                                    <a href="#" class="btn btn-info btn-sm">Edit</a>
                                </td>
                            </tr>
                            {% empty %}
                            <tr>
                                <td colspan="2" class="text-center">No colleges found.</td>
                            </tr>
                            {% endfor %}
                        </tbody>
                    </table>
                    {% include 'includes/pagination.html' %}
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
